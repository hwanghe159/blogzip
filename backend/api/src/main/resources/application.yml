spring:
  application:
    name: blogzip-api
  module:
    name: api
  config:
    import:
      - application-domain.yml
      - application-notification.yml
      - application-ai.yml
jwt:
  secret-key: "${JWT_SECRET_KEY}"
  access-token-expires-days: 7
oauth2:
  google:
    client-id: 538244264177-f2a956r71n7g6cp1tomqfmcsvdu6nhcp.apps.googleusercontent.com
    client-secret: ${GOOGLE_CLIENT_SECRET}
logging:
  level:
    org.hibernate.SQL: info
admin-token: ${ADMIN_TOKEN}
crawler:
  base-url: ${CRAWLER_BASE_URL:http://localhost:8090}

---
spring:
  config:
    activate:
      on-profile: local
oauth2:
  google:
    redirect-uri: http://localhost:3000/login/google
logging:
  level:
    root: debug

---
spring:
  config:
    activate:
      on-profile: local-prod
oauth2:
  google:
    redirect-uri: https://blogzip.co.kr/login/google
logging:
  level:
    root: info

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  level:
    root: warn
oauth2:
  google:
    redirect-uri: https://blogzip.co.kr/login/google
