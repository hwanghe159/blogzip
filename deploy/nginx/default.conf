server {
  listen 80;
  server_name blogzip.co.kr www.blogzip.co.kr;
  return 301 https://$host$request_uri;
}

server {
  listen 80 default_server;
  server_name _;
  return 404;
}

server {
  listen 443 ssl;
  server_name blogzip.co.kr www.blogzip.co.kr;

  root /usr/share/nginx/html;
  index index.html index.htm;

  ssl_certificate /etc/letsencrypt/live/blogzip.co.kr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/blogzip.co.kr/privkey.pem;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    limit_except GET POST PUT PATCH DELETE {
      deny all;
    }

    proxy_pass http://api:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }

  location /swagger-ui/ {
    proxy_pass http://api:8080/swagger-ui/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /v3/api-docs {
    proxy_pass http://api:8080/v3/api-docs;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
