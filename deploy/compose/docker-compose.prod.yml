services:
  crawler:
    image: ${CRAWLER_IMAGE}
    container_name: blogzip-crawler
    restart: unless-stopped
    expose:
      - "8090"

  api:
    image: ${API_IMAGE}
    container_name: blogzip-api
    restart: unless-stopped
    depends_on:
      - crawler
    env_file:
      - .env.runtime
    environment:
      CRAWLER_BASE_URL: http://crawler:8090
    expose:
      - "8080"
    volumes:
      - ./data/heapdumps/api:/app/heapdumps

  batch:
    image: ${BATCH_IMAGE}
    restart: unless-stopped
    profiles:
      - batch
    depends_on:
      - crawler
    env_file:
      - .env.runtime
    environment:
      CRAWLER_BASE_URL: http://crawler:8090
    volumes:
      - ./data/heapdumps/batch:/app/heapdumps

  scheduler:
    image: ${SCHEDULER_IMAGE}
    container_name: blogzip-scheduler
    restart: unless-stopped
    depends_on:
      - crawler
    env_file:
      - .env.runtime
    environment:
      CRAWLER_BASE_URL: http://crawler:8090
    volumes:
      - ./data/heapdumps/batch:/app/heapdumps

  nginx:
    image: ${NGINX_IMAGE}
    container_name: blogzip-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
