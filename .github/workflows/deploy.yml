name: Build And Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DEPLOY_PATH: /opt/blogzip
  IMAGE_PREFIX: ${{ vars.IMAGE_PREFIX }}
  REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
  OCI_REGION: ${{ vars.OCI_REGION }}
  OCI_VAULT_ID: ${{ vars.OCI_VAULT_ID }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      api-image: ${{ steps.images.outputs.api-image }}
      nginx-image: ${{ steps.images.outputs.nginx-image }}
      batch-image: ${{ steps.images.outputs.batch-image }}
      crawler-image: ${{ steps.images.outputs.crawler-image }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate required repository settings
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [[ -z "${REGISTRY_HOST}" ]] && missing+=("vars.REGISTRY_HOST")
          [[ -z "${IMAGE_PREFIX}" ]] && missing+=("vars.IMAGE_PREFIX")
          [[ -z "${OCI_REGION}" ]] && missing+=("vars.OCI_REGION")
          [[ -z "${OCI_VAULT_ID}" ]] && missing+=("vars.OCI_VAULT_ID")
          [[ -z "${REGISTRY_USERNAME}" ]] && missing+=("secrets.REGISTRY_USERNAME")
          [[ -z "${REGISTRY_PASSWORD}" ]] && missing+=("secrets.REGISTRY_PASSWORD")
          [[ -z "${DEPLOY_HOST}" ]] && missing+=("secrets.DEPLOY_HOST")
          [[ -z "${DEPLOY_USER}" ]] && missing+=("secrets.DEPLOY_USER")
          [[ -z "${DEPLOY_SSH_KEY}" ]] && missing+=("secrets.DEPLOY_SSH_KEY")
          if (( ${#missing[@]} > 0 )); then
            echo "Missing required settings:"
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - id: images
        run: |
          echo "api-image=${IMAGE_PREFIX}/api:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "nginx-image=${IMAGE_PREFIX}/nginx:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "batch-image=${IMAGE_PREFIX}/batch:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "crawler-image=${IMAGE_PREFIX}/crawler:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/api.Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.api-image }}
            ${{ env.IMAGE_PREFIX }}/api:latest

      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/nginx.Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.nginx-image }}
            ${{ env.IMAGE_PREFIX }}/nginx:latest

      - name: Build and push batch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/batch.Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.batch-image }}
            ${{ env.IMAGE_PREFIX }}/batch:latest

      - name: Build and push crawler image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/crawler.Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.crawler-image }}
            ${{ env.IMAGE_PREFIX }}/crawler:latest

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Copy deploy assets to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy/compose/*,deploy/scripts/*"
          target: ${{ env.DEPLOY_PATH }}
          strip_components: 1

      - name: Deploy api, crawler and nginx containers
        uses: appleboy/ssh-action@v1.2.0
        env:
          API_IMAGE: ${{ needs.build-and-push.outputs.api-image }}
          NGINX_IMAGE: ${{ needs.build-and-push.outputs.nginx-image }}
          BATCH_IMAGE: ${{ needs.build-and-push.outputs.batch-image }}
          CRAWLER_IMAGE: ${{ needs.build-and-push.outputs.crawler-image }}
          REGISTRY_HOST: ${{ env.REGISTRY_HOST }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          OCI_REGION: ${{ env.OCI_REGION }}
          OCI_VAULT_ID: ${{ env.OCI_VAULT_ID }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: API_IMAGE,NGINX_IMAGE,BATCH_IMAGE,CRAWLER_IMAGE,REGISTRY_HOST,REGISTRY_USERNAME,REGISTRY_PASSWORD,DEPLOY_PATH,OCI_REGION,OCI_VAULT_ID
          script: |
            set -euo pipefail
            mkdir -p "${DEPLOY_PATH}/compose" "${DEPLOY_PATH}/scripts" "${DEPLOY_PATH}/data/heapdumps/api" "${DEPLOY_PATH}/data/heapdumps/batch"
            cat > "${DEPLOY_PATH}/compose/.env.deploy" <<EOF
            API_IMAGE=${API_IMAGE}
            NGINX_IMAGE=${NGINX_IMAGE}
            BATCH_IMAGE=${BATCH_IMAGE}
            CRAWLER_IMAGE=${CRAWLER_IMAGE}
            EOF
            echo "${REGISTRY_PASSWORD}" | docker login "${REGISTRY_HOST}" -u "${REGISTRY_USERNAME}" --password-stdin
            chmod +x "${DEPLOY_PATH}/scripts/"*.sh
            "${DEPLOY_PATH}/scripts/deploy.sh"
