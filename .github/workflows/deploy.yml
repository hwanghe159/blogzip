name: 배포

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "배포할 이미지 태그 (예: latest 또는 git sha)"
        required: true
        default: latest

jobs:
  deploy:
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
