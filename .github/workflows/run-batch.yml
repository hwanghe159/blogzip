name: 배치 잡 실행

on:
  workflow_dispatch:
    inputs:
      job_name:
        description: Spring Batch job name
        required: true
        default: fetch-new-articles
      target_date:
        description: Optional target-date argument (YYYY-MM-DD)
        required: false
        default: ""

env:
  REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
  OCI_REGION: ${{ vars.OCI_REGION }}
  OCI_VAULT_ID: ${{ vars.OCI_VAULT_ID }}

jobs:
  run-batch:
    runs-on: ubuntu-latest
    steps:
      - name: 필수 저장소 설정 검증
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [[ -z "${DEPLOY_HOST}" ]] && missing+=("secrets.DEPLOY_HOST")
          [[ -z "${DEPLOY_USER}" ]] && missing+=("secrets.DEPLOY_USER")
          [[ -z "${DEPLOY_SSH_KEY}" ]] && missing+=("secrets.DEPLOY_SSH_KEY")
          [[ -z "${OCI_REGION}" ]] && missing+=("vars.OCI_REGION")
          [[ -z "${OCI_VAULT_ID}" ]] && missing+=("vars.OCI_VAULT_ID")
          if (( ${#missing[@]} > 0 )); then
            echo "Missing required settings:"
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi

      - name: 서버에서 배치 컨테이너 실행
        uses: appleboy/ssh-action@v1.2.0
        env:
          JOB_NAME: ${{ inputs.job_name }}
          TARGET_DATE: ${{ inputs.target_date }}
          DEPLOY_PATH: /home/${{ secrets.DEPLOY_USER }}/blogzip
          REGISTRY_HOST: ${{ env.REGISTRY_HOST }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          OCI_REGION: ${{ env.OCI_REGION }}
          OCI_VAULT_ID: ${{ env.OCI_VAULT_ID }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: JOB_NAME,TARGET_DATE,DEPLOY_PATH,REGISTRY_HOST,REGISTRY_USERNAME,REGISTRY_PASSWORD,OCI_REGION,OCI_VAULT_ID
          script: |
            set -euo pipefail
            export PATH="$HOME/bin:$PATH"
            if ! command -v oci >/dev/null 2>&1; then
              echo "OCI CLI가 없어 설치를 시도합니다."
              if command -v curl >/dev/null 2>&1; then
                bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
              elif command -v wget >/dev/null 2>&1; then
                bash -c "$(wget -qO- https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
              else
                echo "curl 또는 wget 이 필요합니다." >&2
                exit 1
              fi
              export PATH="$HOME/bin:$PATH"
            fi
            command -v oci >/dev/null 2>&1 || {
              echo "OCI CLI 설치에 실패했습니다." >&2
              exit 1
            }
            chmod +x "${DEPLOY_PATH}/scripts/"*.sh
            if [[ -n "${TARGET_DATE}" ]]; then
              "${DEPLOY_PATH}/scripts/run-batch.sh" \
                --spring.profiles.active=prod \
                --server.port=8081 \
                --spring.batch.job.name="${JOB_NAME}" \
                "target-date=${TARGET_DATE}"
            else
              "${DEPLOY_PATH}/scripts/run-batch.sh" \
                --spring.profiles.active=prod \
                --server.port=8081 \
                --spring.batch.job.name="${JOB_NAME}"
            fi
